services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8787:8787"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.dev.vars
    command: npx wrangler dev --ip 0.0.0.0 --port 8787

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8787/api
    depends_on:
      - backend