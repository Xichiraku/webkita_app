<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | Webkita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 16px;background:linear-gradient(135deg,#f9fafb,#f3f4f6);font-family:"Plus Jakarta Sans",sans-serif;color:#111827}.shell{width:min(100%,440px)}.back{display:inline-flex;align-items:center;gap:8px;margin:0 0 22px;color:#4b5563;text-decoration:none;font-size:14px;font-weight:600}.back:hover{color:#111827}.card{padding:32px;background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 16px 42px #1118270c}.icon{width:58px;height:58px;margin:0 auto 20px;display:grid;place-items:center;border-radius:50%;background:#f3f4f6;color:#374151}.icon svg{width:26px;height:26px}.intro{text-align:center;margin-bottom:26px}.intro h1{margin:0 0 9px;font-size:24px;letter-spacing:-.04em}.intro p{margin:0;color:#6b7280;font-size:13px;line-height:1.7}.intro strong{color:#374151;overflow-wrap:anywhere}.field{margin:0 0 18px}.field label{display:block;margin-bottom:8px;color:#374151;font-size:13px;font-weight:700}.input-wrap{position:relative}.field input{width:100%;height:46px;padding:0 48px 0 13px;border:1px solid #d1d5db;border-radius:9px;font:inherit;font-size:14px;outline:none}.field input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb1c}.toggle{position:absolute;top:50%;right:12px;transform:translateY(-50%);border:0;background:none;color:#6b7280;font:600 11px "Plus Jakarta Sans",sans-serif;cursor:pointer}.hint{margin:7px 0 0;color:#9ca3af;font-size:11px}.button{width:100%;min-height:48px;padding:12px 16px;border:0;border-radius:9px;background:#111827;color:#fff;font:700 14px "Plus Jakarta Sans",sans-serif;cursor:pointer;transition:background .15s}.button:hover:not(:disabled){background:#1f2937}.button:disabled{background:#9ca3af;cursor:not-allowed}.message{margin:0 0 18px;padding:12px 14px;border:1px solid #fecaca;border-radius:9px;background:#fef2f2;color:#991b1b;font-size:13px;line-height:1.55}.success-icon{background:#f0fdf4;color:#16a34a}.footer{margin:18px 0 0;text-align:center;color:#9ca3af;font-size:11px}[hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" id="back-link" href="otp.html"><span aria-hidden="true">←</span> Kembali ke verifikasi OTP</a>
    <section class="card" id="reset-card">
      <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div>
      <div class="intro">
        <h1>Reset Password</h1>
        <p>Buat password baru untuk akun <strong id="account-email"></strong>.</p>
      </div>
      <p class="message" id="error" role="alert" aria-live="polite" hidden></p>
      <form id="reset-form">
        <div class="field">
          <label for="new-password">Password baru</label>
          <div class="input-wrap">
            <input id="new-password" type="password" minlength="8" autocomplete="new-password" required placeholder="Minimal 8 karakter">
            <button class="toggle" type="button" data-toggle="new-password">Lihat</button>
          </div>
          <p class="hint">Gunakan minimal 8 karakter.</p>
        </div>
        <div class="field">
          <label for="confirm-password">Konfirmasi password</label>
          <div class="input-wrap">
            <input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required placeholder="Ulangi password baru">
            <button class="toggle" type="button" data-toggle="confirm-password">Lihat</button>
          </div>
        </div>
        <button class="button" id="submit-button" type="submit">Simpan password baru</button>
      </form>
    </section>
    <section class="card" id="success-card" hidden>
      <div class="icon success-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg></div>
      <div class="intro">
        <h1>Password Berhasil Diubah</h1>
        <p>Alur reset akun <strong id="success-email"></strong> berhasil ditampilkan. Ini hanya preview; password tidak disimpan.</p>
      </div>
      <a class="button" href="login.html" style="display:block;text-align:center;text-decoration:none">Ke halaman login</a>
    </section>
    <p class="footer">Webkita · Lindungi password Anda</p>
  </main>
  <script>
    const handoff = new URLSearchParams(location.hash.slice(1));
    const email = handoff.get("email") || new URLSearchParams(location.search).get("email") || "";
    if (location.hash) history.replaceState(null, "", `${location.pathname}${location.search}`);
    const form = document.getElementById("reset-form");
    const errorBox = document.getElementById("error");
    const newPassword = document.getElementById("new-password");
    const confirmPassword = document.getElementById("confirm-password");
    const submitButton = document.getElementById("submit-button");
    document.getElementById("account-email").textContent = email || "akun Anda";
    if (email) document.getElementById("back-link").href = `otp.html?email=${encodeURIComponent(email)}`;

    document.querySelectorAll("[data-toggle]").forEach((button) => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.toggle);
        input.type = input.type === "password" ? "text" : "password";
        button.textContent = input.type === "password" ? "Lihat" : "Sembunyikan";
      });
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      if (newPassword.value.length < 8) {
        errorBox.textContent = "Password minimal 8 karakter.";
        errorBox.hidden = false;
        return;
      }
      if (newPassword.value !== confirmPassword.value) {
        errorBox.textContent = "Konfirmasi password tidak cocok.";
        errorBox.hidden = false;
        confirmPassword.focus();
        return;
      }
      submitButton.disabled = true;
      submitButton.textContent = "Memproses...";
      document.getElementById("success-email").textContent = email || "akun Anda";
      document.getElementById("reset-card").hidden = true;
      document.getElementById("success-card").hidden = false;
    });
  </script>
</body>
</html>
